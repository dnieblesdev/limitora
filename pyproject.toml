[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "limitora"
version = "0.1.0"
description = "Python library for provider-agnostic LLM interaction with rate limiting and safe local integration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "dnieblesdev", email = "dnieblesp@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
opencode-go = ["httpx>=0.27,<1"]

[project.scripts]
limitora = "limitora.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["limitora*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
limitora = ["py.typed"]
