name: OpenCode live compatibility

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN to authorize the live compatibility check
        required: true
        type: string

permissions: {}

concurrency:
  group: opencode-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  opencode-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: opencode-live
    permissions:
      contents: read
    steps:
      - name: Confirm manual run
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Build fresh wheel from target commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$RUNNER_TEMP/limitora-opencode-dist"
          mkdir "$RUNNER_TEMP/limitora-opencode-dist"
          python -m pip install -r requirements-compatibility.txt
          python -m build --wheel --outdir "$RUNNER_TEMP/limitora-opencode-dist"
          wheels=("$RUNNER_TEMP/limitora-opencode-dist"/*.whl)
          test "${#wheels[@]}" -eq 1

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/limitora-opencode-venv"
          python -m venv "$RUNNER_TEMP/limitora-opencode-venv"
          wheels=("$RUNNER_TEMP/limitora-opencode-dist"/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip install "httpx==0.28.1"
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip install "${wheels[0]}"
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip check

      - name: Assert installed import location
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -I -c 'import os, sys; from pathlib import Path; location = Path(__import__("limitora").__file__).resolve(); venv = Path(sys.prefix).resolve(); checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert venv in location.parents; assert checkout not in (location, *location.parents)'

      - name: Run OpenCode live driver
        shell: bash
        env:
          LIMITORA_OPENCODE_WORKSPACE_ID: ${{ secrets.LIMITORA_OPENCODE_WORKSPACE_ID }}
          LIMITORA_OPENCODE_AUTH_COOKIE: ${{ secrets.LIMITORA_OPENCODE_AUTH_COOKIE }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          python scripts/opencode_live_driver.py --confirm RUN --cli "$RUNNER_TEMP/limitora-opencode-venv/bin/limitora"
