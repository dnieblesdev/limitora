name: OpenCode live compatibility

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN to authorize the live compatibility check
        required: true
        type: string
      artifact-id:
        description: Artifact ID from a successful protected-release build for this exact main SHA
        required: true
        type: string
      artifact-digest:
        description: sha256 digest reported by the protected-release artifact upload
        required: true
        type: string
      workflow-run-id:
        description: Producing protected-release workflow run ID for the artifact
        required: true
        type: string

permissions: {}

concurrency:
  group: opencode-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  opencode-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: opencode-live
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm manual run
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Verify protected artifact identity before download
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/opencode-artifact.json"
          python - "$RUNNER_TEMP/opencode-artifact.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          artifact = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          workflow_run = artifact.get("workflow_run")
          if (str(artifact.get("id")) != os.environ["ARTIFACT_ID"]
                  or artifact.get("digest") != os.environ["EXPECTED_DIGEST"]
                  or artifact.get("expired") is True
                  or not isinstance(workflow_run, dict)
                  or str(workflow_run.get("id", "")) != os.environ["WORKFLOW_RUN_ID"]):
              raise SystemExit("protected artifact identity rejected")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" > "$RUNNER_TEMP/opencode-workflow-run.json"
          python - "$RUNNER_TEMP/opencode-workflow-run.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (run.get("path") != ".github/workflows/protected-release.yml"
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"):
              raise SystemExit("artifact was not produced by a successful protected release run")
          PY

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.workflow-run-id }}
          artifact-ids: ${{ inputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/limitora-opencode-bundle

      - name: Verify repository-bound artifact manifest
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/limitora-opencode-bundle" "$GITHUB_SHA" "$RUNNER_TEMP/opencode-workflow-run.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve()
          expected_sha = sys.argv[2]
          workflow_run = json.loads(Path(sys.argv[3]).read_text(encoding="ascii"))
          receipt = json.loads((root / "build-receipt.json").read_text(encoding="ascii"))
          manifest_path = root / "manifest.sha256"
          rows = {}
          for line in manifest_path.read_text(encoding="ascii").splitlines():
              digest, name = line.split("  ", 1)
              if name in rows or not name or Path(name).is_absolute() or ".." in Path(name).parts:
                  raise SystemExit("invalid protected artifact manifest")
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit("invalid protected artifact digest")
              rows[name] = digest
          if (receipt.get("schema_version") != 1
                  or receipt.get("source_sha") != expected_sha
                  or receipt.get("run_id") != workflow_run.get("id")
                  or receipt.get("run_attempt") != workflow_run.get("run_attempt")
                  or "source-sha.txt" not in rows
                  or (root / "source-sha.txt").read_text(encoding="ascii") != expected_sha + "\n"):
              raise SystemExit("repository-bound artifact receipt rejected")
          metadata = {"manifest.sha256", "build-receipt.json", "archive-inventory.txt", "version.txt"}
          expected = {path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()}
          consumed = expected - metadata
          if set(rows) != consumed or not metadata <= expected:
              raise SystemExit("protected artifact inventory rejected")
          for name, digest in rows.items():
              path = root / name
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("protected artifact hash rejected")
          wheel = next(root.glob("limitora-*.whl"), None)
          sdist = next(root.glob("limitora-*.tar.gz"), None)
          if wheel is None or sdist is None or receipt.get("wheel_sha256") != hashlib.sha256(wheel.read_bytes()).hexdigest() or receipt.get("sdist_sha256") != hashlib.sha256(sdist.read_bytes()).hexdigest():
              raise SystemExit("protected distribution receipt rejected")
          if hashlib.sha256(manifest_path.read_bytes()).hexdigest() != receipt.get("manifest_sha256"):
              raise SystemExit("protected manifest receipt rejected")
          if hashlib.sha256((root / "archive-inventory.txt").read_bytes()).hexdigest() != receipt.get("inventory_sha256"):
              raise SystemExit("protected inventory receipt rejected")
          if receipt.get("run_id") != workflow_run.get("id"):
              raise SystemExit("protected workflow run mismatch")
          PY

      - name: Verify installed distribution contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$RUNNER_TEMP/limitora-opencode-dist"
          mkdir "$RUNNER_TEMP/limitora-opencode-dist"
          cp "$RUNNER_TEMP/limitora-opencode-bundle"/limitora-*.whl "$RUNNER_TEMP/limitora-opencode-dist/"
          cp "$RUNNER_TEMP/limitora-opencode-bundle"/limitora-*.tar.gz "$RUNNER_TEMP/limitora-opencode-dist/"
          wheelhouse="$RUNNER_TEMP/limitora-opencode-bundle/wheelhouse"
          python -m pip install --disable-pip-version-check --no-index --find-links "$wheelhouse" "packaging==26.0"
          python scripts/verify_distributions.py "$RUNNER_TEMP/limitora-opencode-dist"

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/limitora-opencode-venv"
          python -m venv "$RUNNER_TEMP/limitora-opencode-venv"
          wheelhouse="$RUNNER_TEMP/limitora-opencode-bundle/wheelhouse"
          wheel="$(printf '%s\n' "$RUNNER_TEMP/limitora-opencode-dist"/*.whl)"
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip install --no-index --find-links "$wheelhouse" "httpx==0.28.1"
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip install --no-index --no-deps "$wheel"
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -m pip check

      - name: Assert installed import location
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/limitora-opencode-venv/bin/python" -I -c 'import os, sys; from pathlib import Path; location = Path(__import__("limitora").__file__).resolve(); venv = Path(sys.prefix).resolve(); checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert venv in location.parents; assert checkout not in (location, *location.parents)'

      - name: Run OpenCode live driver
        shell: bash
        env:
          LIMITORA_OPENCODE_API_KEY: ${{ secrets.LIMITORA_OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          python scripts/opencode_live_driver.py --confirm RUN --cli "$RUNNER_TEMP/limitora-opencode-venv/bin/limitora"
